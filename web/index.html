<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OEvent HTMX Upload</title>
    <script src="/static/htmx.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 2rem; max-width: 600px; margin: 0 auto; }
        .drop-zone {
            border: 2px dashed #ccc;
            padding: 50px;
            text-align: center;
            border-radius: 10px;
            background: #fafafa;
            transition: border-color 0.2s, background 0.2s;
            cursor: pointer;
        }
        .drop-zone.dragover { border-color: #28a745; background: #e9f7ef; }
        .htmx-indicator { display: none; margin-top: 15px; font-weight: bold; color: #0056b3;}
        .htmx-request .htmx-indicator { display: block; }
    </style>
</head>
<body>
    <h1>Upload Course XML</h1>
    
    <div id="upload-container">
        
        <form id="upload-form" hx-post="/submit-prioritize-job" hx-encoding="multipart/form-data" hx-target="#upload-container" hx-swap="outerHTML">
            
            <div id="drop-zone" class="drop-zone">
                <p>Drag and drop your IOF XML file here</p>
                <p style="font-size: 0.8em; color: #666;">Or click to select</p>
                
                <input type="file" id="file-input" name="xml_file" style="display: none;" accept=".xml">
            </div>

            <div class="htmx-indicator">⏳ Uploading directly to MinIO...</div>
        </form>

    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const form = document.getElementById('upload-form');

        // 1. Make the whole zone clickable
        dropZone.addEventListener('click', () => fileInput.click());

        // 2. Visual feedback on drag
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
        });

        // 3. Handle the actual drop
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');

            if (e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files; // Assign dropped file
                htmx.trigger(form, 'submit');           // Tell HTMX to submit the form
            }
        });

        // 4. Handle standard file browser selection
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                htmx.trigger(form, 'submit');
            }
        });
    </script>
</body>
</html>
