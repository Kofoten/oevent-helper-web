<!DOCTYPE html>

<html>

<head>
  <title>OEvent Helper</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preload" id="webassembly" />
  <style>
      body {
          font-family: system-ui, -apple-system, sans-serif;
          background-color: #1e1e1e;
          color: #d4d4d4;
          padding: 2rem;
          max-width: 800px;
          margin: 0 auto;
      }

      .chassis-panel {
          background: #252526;
          border: 1px solid #333;
          padding: 1.5rem;
          border-radius: 8px;
          margin-bottom: 2rem;
      }

      pre {
          background: #000;
          padding: 1rem;
          border-radius: 4px;
          overflow-x: auto;
          color: #4fc1ff;
      }

      input[type="file"] {
          font-size: 1.1rem;
          cursor: pointer;
      }
  </style>
  <script type="importmap"></script>
  <script type='module' src="main#[.{fingerprint}].js"></script>
</head>

<body>
  <h1>🏎️ Orienteering Test-Run Optimizer</h1>
  <p>Powered by raw .NET 10 WebAssembly.</p>

  <div class="chassis-panel">
    <label for="xml-upload"><strong>Upload IOF 3.0 XML:</strong></label><br><br>
    <input type="file" id="xml-upload" accept=".xml" />
  </div>

  <h2>Engine Telemetry Output:</h2>
  <pre id="result-display">Awaiting ignition...</pre>
</body>

</html>
