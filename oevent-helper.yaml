apiVersion: v1
kind: Pod
metadata:
  name: oevent-pod
  namespace: web-servers
  labels:
    run: oevent-pod
spec:
  containers:
    - name: oevent-app
      image: oevent-helper:latest
      imagePullPolicy: Never
      ports:
        - containerPort: 8080

---

apiVersion: v1
kind: Service
metadata:
  name: oevent-svc
  namespace: web-servers
spec:
  type: NodePort
  selector:
    run: oevent-pod
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 31944
